# Author:    mikomeller
# Version:   0.1.0
# Filename:  board-sync.yml
# Pathname:  .github/workflows/board-sync.yml
# Purpose:   Move the GitHub Project cards named in a pull request title: In progress when the PR opens,
#            Test when it is merged (scripts/board_sync.py). Runbook: doc/runbooks/board_automation.md
#
# Why pull_request_target: the workflow file and scripts/board_sync.py always come from main, never from
# the pull request, so a PR cannot change the code that sees the PROJECT_TOKEN secret. The job therefore
# checks out the default ref (the base branch) and NEVER the pull request's head.
# The PR title is untrusted text: it reaches the script only through env, never inside a run: line.
name: Board sync

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, edited, closed]

permissions:
  contents: read

concurrency:
  group: board-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    # not for drafts; closed without merge does nothing
    if: >-
      !github.event.pull_request.draft
      && (github.event.action != 'closed' || github.event.pull_request.merged)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Move the cards named in the title
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EVENT: ${{ github.event.action == 'closed' && 'merged' || 'opened' }}
        run: >-
          python3 scripts/board_sync.py --event "$EVENT" --pr "$PR_NUMBER" --title "$PR_TITLE"
          --sha "$MERGE_SHA" --repo "$GITHUB_REPOSITORY"
