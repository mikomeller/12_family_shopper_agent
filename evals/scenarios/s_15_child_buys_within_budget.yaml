# Purpose:   L3 scenario S-15: a child buys a book within the child budget; one order, no approval request, no parent tool
id: S-15
level: l3
kind: task
runs: 3
caller: child
prompt: "Buy Der Hobbit"
expect:
  orders_created: 1
  approval_requests_created: 0
  tool_order: [check_budget, place_order]
  no_tool_called: [request_approval, list_requests, approve_request, reject_request, set_budget]
